# Smoke tests for the classic Python templates (.scripts/classic-app-tests).
# The weekly run doubles as the dependency-upgrade check: requirements.txt use
# ranges, so a new upstream release that breaks a template fails here first.
name: classic-app-smoke

on:
  pull_request:
    paths:
      - "*-app/**"
      - "*-app-obo-user/**"
      - ".scripts/templates.py"
      - ".scripts/generate-classic-docs.py"
      - ".scripts/classic-app-tests/**"
      - ".github/workflows/classic-app-smoke.yml"
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: databricks/setup-cli@main
      - name: Generated files are up to date
        run: |
          uv run --no-project --with pyyaml python .scripts/generate-classic-docs.py
          git diff --exit-code -- '*/README.md' '*/databricks.yml'
      - name: Smoke tests
        working-directory: .scripts/classic-app-tests
        run: uv run pytest -v -n 8
