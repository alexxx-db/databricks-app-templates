# Smoke tests for the classic Python templates (.scripts/classic-app-tests).
# The weekly run doubles as the dependency-upgrade check: requirements.txt use
# ranges, so a new upstream release that breaks a template fails here first.
name: classic-app-smoke

on:
  pull_request:
    paths:
      - "*-app/**"
      - "*-app-obo-user/**"
      - "retail-customer-assistant/**"
      - "hls-clinical-explorer/**"
      - "aml-alert-triage/**"
      - "city-311-operations/**"
      - "factory-oee-maintenance/**"
      - "telco-network-care/**"
      - ".scripts/templates.py"
      - ".scripts/generate-classic-docs.py"
      - ".scripts/classic-app-tests/**"
      - ".github/workflows/classic-app-smoke.yml"
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: databricks/setup-cli@6a2e75f1f954d87503702c408deea63216c0799d # v1.18.0
      - name: Generated files are up to date
        run: |
          uv run --no-project --with pyyaml python .scripts/generate-classic-docs.py
          git diff --exit-code -- '*/README.md' '*/databricks.yml'
      - name: Smoke tests
        working-directory: .scripts/classic-app-tests
        run: uv run pytest -v -n 8

  showcases:
    # Local Spark end-to-end tests for the Python showcases (HLS downloads the open MIMIC demos).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        template: [retail-customer-assistant, hls-clinical-explorer, aml-alert-triage, city-311-operations, factory-oee-maintenance, telco-network-care]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Local end-to-end tests
        working-directory: ${{ matrix.template }}
        run: uv run --no-project --python 3.11 --with "pyspark~=4.0" --with pytest --with-requirements requirements.txt pytest tests -q
