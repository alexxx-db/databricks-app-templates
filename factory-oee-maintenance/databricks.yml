# Factory OEE & maintenance: app + setup job.
#
#   databricks bundle deploy -t dev --var sql_warehouse_id=<id>
#   databricks bundle run setup -t dev     # generate data, grant the app access
#   databricks bundle run app -t dev       # start the app
bundle:
  name: factory-oee-maintenance

variables:
  sql_warehouse_id:
    description: SQL warehouse ID (`databricks warehouses list`)
  serving_endpoint_name:
    description: Chat model endpoint for work-order drafts (a Databricks-hosted model by default)
    default: databricks-meta-llama-3-3-70b-instruct
  catalog:
    description: Catalog for the demo tables (must exist)
    default: main
  schema:
    description: Schema for the demo tables (created by the setup job). Keep PLANT_SCHEMA in app.yaml in sync.
    default: plant_ops

resources:
  apps:
    app:
      name: factory-oee-maintenance
      description: OEE analytics, predictive maintenance alerts and AI-drafted work orders for a plant.
      source_code_path: ./
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: serving-endpoint
          serving_endpoint:
            name: ${var.serving_endpoint_name}
            permission: CAN_QUERY

  jobs:
    setup:
      name: factory-oee-maintenance-setup
      tasks:
        - task_key: generate_data
          spark_python_task:
            python_file: ./setup/generate_data.py
            parameters: [--catalog, "${var.catalog}", --schema, "${var.schema}", --app-name, "${resources.apps.app.name}"]
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "3"

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
